name: Verify source
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sw_vers
          xcrun swift --version
      - name: Build and validate app
        run: bash scripts/build-app.sh
      - name: Read-only and fixture regression tests
        run: |
          bash scripts/test-map.sh
          bash scripts/test-core.sh
          bash scripts/test-workflow.sh
          bash scripts/test-flow.sh
          bash scripts/test-journeys.sh
          bash scripts/test-improvements.sh
